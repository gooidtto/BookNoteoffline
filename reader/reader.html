<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookNote Reader</title><link rel="stylesheet" href="reader.css?v=7.13.1"><link rel="stylesheet" href="canonical-layout.css?v=7.13.1"><style id="v710234-reader-management">.selection-toolbar{min-width:max-content}.selection-toolbar button{height:30px;min-height:30px;white-space:nowrap}</style><style id="v710256-reference-icons">.bn-reader-icon{width:22px;height:22px;flex:0 0 22px;display:block;object-fit:contain}.tool-btn .bn-reader-icon{width:22px;height:22px;flex-basis:22px}.nav-destination .bn-reader-icon{width:22px;height:22px;flex-basis:22px}.side-tabs button .bn-reader-icon{width:20px;height:20px;display:inline-block;margin-right:3px}.selection-toolbar button{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:32px;min-height:32px;white-space:nowrap}.selection-toolbar .bn-reader-icon{width:20px;height:20px;flex-basis:20px}.tts-btn{display:flex;align-items:center;justify-content:flex-start;gap:6px}.tts-btn .bn-reader-icon{width:20px;height:20px;flex-basis:20px}.tts-float-btn .bn-reader-icon{width:26px;height:26px;flex-basis:26px}.tts-panel-head .bn-reader-icon{width:20px;height:20px;display:inline-block;vertical-align:middle}.side-tabs button{display:flex;align-items:center;justify-content:center;gap:3px}</style><style id="v710258-unified-icon-system">
.bn-reader-icon{width:20px;height:20px;flex:0 0 20px;display:inline-block;object-fit:contain}.tool-btn .bn-reader-icon,.nav-destination .bn-reader-icon{width:22px;height:22px;flex-basis:22px}.search-inline-icon{width:20px;height:20px;flex-basis:20px}.search-leading{display:flex;align-items:center;justify-content:center}.search-float-btn .bn-reader-icon{width:22px;height:22px;flex-basis:22px}.tts-float-btn .bn-reader-icon{width:24px;height:24px;flex-basis:24px}.tts-panel-head .bn-reader-icon{width:20px;height:20px;flex-basis:20px}.tts-btn .bn-reader-icon{width:18px;height:18px;flex-basis:18px}.theme-mode-row .bn-reader-icon{width:18px;height:18px;flex-basis:18px}.side-tabs button .bn-reader-icon{width:18px;height:18px;flex-basis:18px;margin-right:3px}
</style></head><body><div id="app">
<header class="reader-head">
  <nav class="reader-left" aria-label="阅读导航">
    <button id="homeBtn" class="tool-btn nav-destination" title="首页" aria-label="首页"><img class="bn-reader-icon" src="../img/ui/home.png" alt=""><span class="btn-label">首页</span></button>
    <button id="shelfBtn" class="tool-btn nav-destination" title="书架" aria-label="书架"><img class="bn-reader-icon" src="../img/ui/bookshelf.png" alt=""><span class="btn-label">书架</span></button>
    <button id="sidebarBtn" class="tool-btn" title="目录" aria-label="目录"><img class="bn-reader-icon" src="../img/ui/toc.png" alt=""><span class="btn-label">目录</span></button>
    <button id="themeBtn" class="tool-btn" title="主题" aria-label="主题"><img class="bn-reader-icon" src="../img/ui/theme.png" alt=""><span class="btn-label">主题</span></button>
    <button id="modeBtn" class="tool-btn" title="白天/黑夜" aria-label="白天/黑夜"><img id="modeIcon" class="bn-reader-icon" src="../img/ui/sun.png" alt=""><span id="modeLabel" class="btn-label">白天</span></button>
  </nav>
  <div class="book-title"><strong id="title">正在加载…</strong><span id="author"></span></div>
  
</header>

<main id="readerBody" class="reader-body"><div id="sidebarScrim" class="sidebar-scrim" hidden></div><aside id="sidebar" class="sidebar"><div class="side-head"><strong id="sideTitle">目录</strong><button id="closeSide">×</button></div><nav class="side-tabs" aria-label="阅读器侧栏"><button data-tab="toc" class="active" title="目录"><img class="bn-reader-icon" src="../img/ui/toc.png" alt=""><span class="side-tab-label">目录</span></button><button data-tab="annotations" title="标注"><img class="bn-reader-icon" src="../img/ui/highlight.png" alt=""><span class="side-tab-label">标注</span></button><button data-tab="bookmarks" title="书签"><img class="bn-reader-icon" src="../img/ui/bookmark.png" alt=""><span class="side-tab-label">书签</span></button><button data-tab="contentNotes" title="内容注释"><img class="bn-reader-icon" src="../img/ui/note.png" alt=""><span class="side-tab-label">内容注释</span></button></nav><div id="sideContent"></div></aside><section id="readerCenter" class="reader-center"><section id="searchBar" class="search-bar" hidden>
  <div class="search-wrap">
    <div class="search-box">
      <span class="search-leading" aria-hidden="true"><img class="bn-reader-icon search-inline-icon" src="../img/ui/search.png" alt=""></span>
      <input id="searchInput" autocomplete="off" placeholder="搜索" aria-label="搜索本书">
      <button type="button" id="searchClear" class="search-clear" aria-label="清除搜索" title="清除搜索">×</button>
      <button type="button" id="searchSubmit" class="search-submit" aria-label="搜索" title="搜索"><img class="bn-reader-icon search-inline-icon" src="../img/ui/search.png" alt=""></button>
    </div>
    <div class="search-history" id="searchHistory" hidden></div>
  </div>
  <span id="searchStatus"></span><div class="search-export-actions" role="group" aria-label="搜索结果导出"><button id="exportAllSearch" type="button" title="导出所有搜索命中所在的段落；同一段落只导出一次" disabled>导出全部搜索</button><button id="exportCurrentSearch" type="button" title="只导出当前搜索位置所在的一个段落" disabled>导出当前搜索</button></div><button id="prevHit" title="上一个结果">↑</button><button id="nextHit" title="下一个结果">↓</button>
</section><section id="viewport" class="viewport"><div id="content" class="content" hidden></div><iframe id="pdf" class="pdf" hidden></iframe><div id="searchFloat" class="search-float" aria-label="搜索工具"><button id="searchFloatBtn" class="search-float-btn" title="搜索本书" aria-expanded="false"><img class="bn-reader-icon" src="../img/ui/search.png" alt=""></button></div><div id="selectionToolbar" class="selection-toolbar" hidden><button data-action="highlight"><img class="bn-reader-icon" src="../img/ui/highlight.png" alt="">高亮</button><button data-action="bookmark"><img class="bn-reader-icon" src="../img/ui/bookmark.png" alt="">书签</button><button data-action="copy"><img class="bn-reader-icon" src="../img/ui/note.png" alt="">复制</button><button data-action="search"><img class="bn-reader-icon" src="../img/ui/search.png" alt="">搜索</button><button data-action="summary-note"><img class="bn-reader-icon" src="../img/ui/note.png" alt="">BookNote</button><button data-action="content-annotation"><img class="content-annotation-icon" src="../img/ui/note.png" alt="">内容注释</button></div><div id="highlightColorPicker" class="highlight-color-picker" hidden aria-label="高亮颜色选择"></div><div id="bookmarkStarPicker" class="bookmark-star-picker" hidden aria-label="书签星级选择"></div><div id="ttsFloat" class="tts-float" aria-label="朗读工具">
  <button id="ttsFloatBtn" class="tts-float-btn" title="朗读工具" aria-expanded="false"><img class="bn-reader-icon" src="../img/ui/speaker.png" alt=""></button>
  <div id="ttsPanel" class="tts-panel" hidden>
    <div class="tts-panel-head"><strong><img class="bn-reader-icon" src="../img/ui/speaker.png" alt="">朗读</strong><button id="closeTtsPanel" class="popover-close" title="关闭">×</button></div>
    <div class="tts-panel-actions">
      <button id="voiceSettingsBtn" class="tts-btn" title="语音设置"><img class="bn-reader-icon" src="../img/ui/voice-settings.png" alt="">语音设置</button>
      <button id="readHomeBtn" class="tts-btn" title="从本书开头朗读所有内容"><img class="bn-reader-icon" src="../img/ui/speaker.png" alt="">从首页朗读所有</button>
      <button id="readCurrentBtn" class="tts-btn" title="从当前阅读位置开始朗读"><img class="bn-reader-icon" src="../img/ui/speaker.png" alt="">从选中位置朗读</button>
      <button id="readSelectionBtn" class="tts-btn" title="朗读当前选中的内容"><img class="bn-reader-icon" src="../img/ui/speaker.png" alt="">只朗读选中内容</button>
      <button id="readToggleBtn" class="tts-btn" title="暂停或继续朗读"><img class="bn-reader-icon" src="../img/ui/pause.png" alt="">暂停 / 继续</button>
      <button id="readSentenceFollowBtn" class="tts-btn tts-follow-btn" type="button" aria-pressed="false" title="朗读时显示当前句高亮"><img class="bn-reader-icon" src="../img/ui/highlight.png" alt="">逐句跟随：关</button>
      <button id="readWordFollowBtn" class="tts-btn tts-follow-btn" type="button" aria-pressed="true" title="朗读时按语音边界逐字/词组独立高亮并跟随"><img class="bn-reader-icon" src="../img/ui/highlight.png" alt="">逐字/词跟随：开</button>
      <button id="readStopBtn" class="tts-btn" title="停止朗读" disabled><img class="bn-reader-icon" src="../img/ui/stop.png" alt="">停止朗读</button>
    </div>
  </div>
</div><footer class="reader-foot" id="bottomNavigator">
  <div class="reader-foot-left"><button id="prevChapter" title="上一章">‹ 上一章</button><button id="prevPage" title="上一页">‹ 上一页</button><button id="readerScrollTop" class="reader-edge-btn" title="移动到本章顶部" aria-label="移动到本章顶部">↑ 顶部</button></div>
  <div class="reader-foot-center"><span id="chapter"></span><span id="format" hidden></span><input id="readerScrollSlider" class="reader-scroll-slider" type="range" min="0" max="1000" value="0" step="1" aria-label="阅读位置" title="拖动调整阅读位置"><span id="progress">0%</span></div>
  <div class="reader-foot-right"><button id="readerScrollBottom" class="reader-edge-btn" title="移动到本章底部" aria-label="移动到本章底部">↓ 底部</button><button id="nextPage" title="下一页">下一页 ›</button><button id="nextChapter" title="下一章">下一章 ›</button></div>
</footer></section></main>
<div id="settingsPanel" class="popover theme-popover" hidden>
  <div class="theme-popover-head"><h3>主题</h3><button id="closeSettings" class="popover-close" title="关闭">×</button></div>
  <div class="reader-theme-grid">
    <button type="button" class="reader-theme-option" data-theme-choice="nord"><span class="theme-dot nord"></span><span>北欧冷色</span></button>
    <button type="button" class="reader-theme-option" data-theme-choice="atom"><span class="theme-dot atom"></span><span>原子深色</span></button>
    <button type="button" class="reader-theme-option" data-theme-choice="everforest"><span class="theme-dot everforest"></span><span>森林深色</span></button>
    <button type="button" class="reader-theme-option" data-theme-choice="onehalf"><span class="theme-dot onehalf"></span><span>单色深黑</span></button>
    <button type="button" class="reader-theme-option" data-theme-choice="dracula"><span class="theme-dot dracula"></span><span>德古拉</span></button>
  </div>
  <div class="theme-mode-row"><button id="lightTheme" type="button"><img class="bn-reader-icon" src="../img/ui/sun.png" alt="">白天</button><button id="darkTheme" type="button"><img class="bn-reader-icon" src="../img/ui/moon.png" alt="">黑夜</button></div>
  <details class="reader-typography"><summary>阅读排版</summary>
    <label>字体 <input id="fontScale" type="range" min="80" max="150" step="5"></label>
    <label>行距 <input id="lineHeight" type="range" min="14" max="26" step="1"></label>
    <label>版心 <select id="widthMode"><option value="narrow">窄</option><option value="medium">中</option><option value="wide">宽</option></select></label>
    <div class="popover-actions"><button id="saveTypography">保存排版</button></div>
  </details>
</div><div id="morePanel" class="popover more" hidden><button id="homeMore"><img class="bn-reader-icon" src="../img/ui/home.png" alt="">返回首页</button><button id="shelfMore"><img class="bn-reader-icon" src="../img/ui/bookshelf.png" alt="">返回书架</button><button id="exportCanonicalModel">导出 Canonical Model</button><button id="importCanonicalModel">导入 Canonical Model</button><button id="exportAnnotations">导出本书标注</button><input id="canonicalImportFile" type="file" accept="application/json,.json" hidden></div><div id="toast" class="toast"></div>
</div><script src="../js/txt-heading-rules.js"></script><script src="../js/booknote-global-theme.js"></script><script src="../js/book-library-db.js"></script><script src="../js/booknote-annotations.js"></script><script src="../js/booknote-search-index.js"></script><script src="readest-bridge.js"></script><script src="canonical-core.js"></script><script src="canonical-block.js"></script><script src="canonical-toc.js"></script><script src="canonical-block-adapter.js"></script><script src="canonical-office-block-adapter.js"></script>
<script src="canonical-txt-adapter.js"></script><script src="canonical-locator.js"></script><script src="canonical-pdf-adapter.js"></script><script src="canonical-pdf-block-adapter.js"></script><script src="canonical-search-hit.js"></script><script src="canonical-resolver.js"></script><script src="canonical-toc-resolver.js"></script><script src="canonical-document-validator.js"></script><script src="canonical-export.js"></script><script src="canonical-import.js"></script><script src="epub-multimodule.js"></script><script src="epub-unified-locator.js"></script><script src="epub-semantic-layout.js"></script><script src="readest-runtime.js"></script><script src="../js/txt-semantic-candidate-v65.js"></script><script src="../js/txt-semantic-visual-v67.js"></script><script src="reader.js"></script><script src="speech-highlight-core.js"></script></body></html>
