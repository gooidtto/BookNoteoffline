<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Viewer | Read Aloud</title>

  <style>
    :root{
      --pdf-shell-bg:#f3f1e5;
      --pdf-shell-surface:#faf9ee;
      color-scheme:light;
    }
    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:var(--pdf-shell-bg);
    }
    body[data-mode="night"]{
      background:var(--pdf-shell-bg);
    }
    #viewer-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-width: 0;
      background:var(--pdf-shell-bg);
    }
  </style>

  <script src="js/rxjs.umd.min.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/booknote-global-theme.js"></script>
  <script src="js/pdf-viewer.js"></script>
</head>
<body>
  <iframe id="viewer-frame"></iframe>
</body>
</html>
