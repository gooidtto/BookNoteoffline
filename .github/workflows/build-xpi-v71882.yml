name: Build XPI v7.18.82
on:
  push:
    branches:
      - refactor/txt-design-v71882
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          node --check reader/readest-runtime.js
          node --check reader/reader.js
          node --check js/txt-heading-rules.js
          node --check js/booknote-annotations.js
          node test/txt-derived-formats-v71882.js
          node test/format-locator-isolation-v71880.js
      - name: Build XPI
        run: |
          zip -qr BookNote-v7.18.82-fixed.xpi . -x ".git/*" ".github/*" "*.xpi"
          unzip -t BookNote-v7.18.82-fixed.xpi
          sha256sum BookNote-v7.18.82-fixed.xpi
      - uses: actions/upload-artifact@v4
        with:
          name: BookNote-v7.18.82-fixed
          path: BookNote-v7.18.82-fixed.xpi
